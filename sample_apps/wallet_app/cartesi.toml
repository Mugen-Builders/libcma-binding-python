[machine]
entrypoint = "/usr/local/bin/python3 /mnt/app/app.py /dev/uio0"
ram_length = "64Mi"
workdir = "/mnt/app"

[drives.root]
builder = "docker"
dockerfile = "alpine.dockerfile"
format = "ext2"
target = "rootfs"
extra_size = "16Mb"
avoid_overwrite = "true"

[drives.app]
builder = "docker"
dockerfile = "alpine.dockerfile"
format = "sqfs"
target = "app"
build_args=["WALLET_APP_CONFIG=config.py"]

[nvrams.state]
builder = "raw"
length = "64Mb"
user = "dapp"
